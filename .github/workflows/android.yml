name: Android Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.STORE_PASSWORD || 'svitlo2026pass' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEY_STORE_PASSWORD || secrets.STORE_PASSWORD || 'svitlo2026pass' }}
        run: |
          ./gradlew assembleRelease -x test --no-daemon --stacktrace
          cp app/build/outputs/apk/release/*.apk ./Svitlo-Release.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Svitlo-Release-APK
          path: Svitlo-Release.apk
          if-no-files-found: error
