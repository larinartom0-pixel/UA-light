name: Android Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Setup Permanent Keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY || secrets.KEYSTORE_BASE64 || secrets.KEYSTORE }}
          KEY_STORE_PASS: ${{ secrets.KEY_STORE_PASSWORD || secrets.STORE_PASSWORD || 'svitlo2026pass' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.KEY_STORE_PASSWORD || secrets.STORE_PASSWORD || 'svitlo2026pass' }}
          USER_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/my-upload-key.jks"
          rm -f "$KEYSTORE_FILE"

          # Permanent production keystore encoded in base64 (2048-bit RSA, valid until 2054)
          PERMANENT_KEYSTORE=""

          # Prefer secret if provided and valid, otherwise use permanent keystore
          KEY_DATA="${SIGNING_KEY:-$PERMANENT_KEYSTORE}"
          echo "$KEY_DATA" | tr -d '\r\n ' | base64 -d > "$KEYSTORE_FILE"

          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEY_STORE_PASS" >/dev/null 2>&1; then
            echo "Provided secret failed verification, decoding permanent key..."
            echo "$PERMANENT_KEYSTORE" | tr -d '\r\n ' | base64 -d > "$KEYSTORE_FILE"
            KEY_STORE_PASS="svitlo2026pass"
            KEY_PASS="svitlo2026pass"
          fi

          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
          echo "STORE_PASSWORD=$KEY_STORE_PASS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease -x test --no-daemon --stacktrace
          cp app/build/outputs/apk/release/*.apk ./Svitlo-Release.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Svitlo-Release-APK
          path: Svitlo-Release.apk
          if-no-files-found: error
