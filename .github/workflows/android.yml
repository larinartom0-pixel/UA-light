          fi

          # 2. Determine working password (verify with keytool)
          STORE_PASS="svitlo2026pass"
          if [ -n "$INPUT_STORE_PASS" ] && keytool -list -keystore "$KEYSTORE_FILE" -storepass "$INPUT_STORE_PASS" >/dev/null 2>&1; then
            STORE_PASS="$INPUT_STORE_PASS"
          fi

          KEY_PASS="$STORE_PASS"
          if [ -n "$INPUT_KEY_PASS" ]; then
            KEY_PASS="$INPUT_KEY_PASS"
          fi

          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
          echo "STORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          echo "Keystore ready: $KEYSTORE_FILE (alias: upload)"

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease -x test --no-daemon --stacktrace
          cp app/build/outputs/apk/release/*.apk ./Svitlo-Release.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Svitlo-Release-APK
          path: Svitlo-Release.apk
          if-no-files-found: error
