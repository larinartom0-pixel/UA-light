name: Android CI & Release Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign APK / AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Setup Keystore from Secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY || secrets.KEYSTORE_BASE64 || secrets.KEYSTORE }}
          KEY_STORE_PASS: ${{ secrets.KEY_STORE_PASSWORD || secrets.STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          USER_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "Decoding SIGNING_KEY secret..."
            echo "$SIGNING_KEY" | base64 -d > "${GITHUB_WORKSPACE}/my-upload-key.jks"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            
            # Align alias with Gradle's expected 'upload' alias
            if [ -n "$KEY_STORE_PASS" ]; then
              # Detect existing alias in keystore
              DETECTED_ALIAS=$(keytool -list -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" -storepass "$KEY_STORE_PASS" 2>/dev/null | grep -i "PrivateKeyEntry" | head -n 1 | awk -F',' '{print $1}' | tr -d ' ' || true)
              TARGET_ALIAS="${USER_ALIAS:-$DETECTED_ALIAS}"
              
              if [ -n "$TARGET_ALIAS" ] && [ "$TARGET_ALIAS" != "upload" ]; then
                echo "Renaming alias '$TARGET_ALIAS' to 'upload' for Gradle signing..."
                keytool -changealias -alias "$TARGET_ALIAS" -destalias "upload" \
                  -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" \
                  -storepass "$KEY_STORE_PASS" \
                  -keypass "${KEY_PASS:-$KEY_STORE_PASS}" || true
              fi
            fi
          elif [ -f "${GITHUB_WORKSPACE}/my-upload-key.jks" ]; then
            echo "Using existing my-upload-key.jks..."
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
          else
            echo "Warning: No release keystore secret provided."
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/debug.keystore" >> $GITHUB_ENV
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Signed Release APK & Bundle
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease -x test --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload Release AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
