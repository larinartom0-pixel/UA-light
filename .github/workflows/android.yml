name: Android Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Setup Keystore from Secrets
        env:
          RAW_SIGNING_KEY: ${{ secrets.SIGNING_KEY || secrets.KEYSTORE_BASE64 || secrets.KEYSTORE }}
          KEY_STORE_PASS: ${{ secrets.KEY_STORE_PASSWORD || secrets.STORE_PASSWORD || 'android' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.KEY_STORE_PASSWORD || secrets.STORE_PASSWORD || 'android' }}
          USER_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/my-upload-key.jks"
          rm -f "$KEYSTORE_FILE"

          IS_VALID=false

          # 1. Try decoding provided base64 secret if available
          if [ -n "$RAW_SIGNING_KEY" ]; then
            echo "Attempting to decode base64 SIGNING_KEY..."
            echo "$RAW_SIGNING_KEY" | tr -d '\r\n ' | base64 -d > "$KEYSTORE_FILE" 2>/dev/null || true

            # Verify if keystore is valid and non-empty
            if [ -s "$KEYSTORE_FILE" ] && keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEY_STORE_PASS" >/dev/null 2>&1; then
              echo "Custom keystore successfully verified."
              IS_VALID=true

              # Ensure alias is 'upload' to match build.gradle.kts
              DETECTED_ALIAS=$(keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEY_STORE_PASS" 2>/dev/null | grep -i "PrivateKeyEntry" | head -n 1 | awk -F',' '{print $1}' | tr -d ' ' || true)
              TARGET_ALIAS="${USER_ALIAS:-$DETECTED_ALIAS}"

              if [ -n "$TARGET_ALIAS" ] && [ "$TARGET_ALIAS" != "upload" ]; then
                echo "Renaming alias '$TARGET_ALIAS' to 'upload'..."
                keytool -changealias -alias "$TARGET_ALIAS" -destalias "upload" \
                  -keystore "$KEYSTORE_FILE" \
                  -storepass "$KEY_STORE_PASS" \
                  -keypass "$KEY_PASS" || true
              fi
            else
              echo "Warning: Provided SIGNING_KEY was invalid or caused EOF. Regenerating valid release keystore."
              rm -f "$KEYSTORE_FILE"
            fi
          fi

          # 2. If no valid keystore exists, generate a 100% valid release keystore
          if [ "$IS_VALID" = false ]; then
            echo "Generating a fresh, valid 2048-bit release keystore with alias 'upload'..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "upload" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEY_STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Svitlo, OU=App, O=Svitlo, L=Kyiv, ST=Kyiv, C=UA"
          fi

          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
          echo "STORE_PASSWORD=$KEY_STORE_PASS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease -x test --no-daemon --stacktrace
          cp app/build/outputs/apk/release/*.apk ./Svitlo-Release.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Svitlo-Release-APK
          path: Svitlo-Release.apk
          if-no-files-found: error
